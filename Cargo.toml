[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"

[workspace.dependencies]
det = { path = "crates/det" }
airport = { path = "crates/airport" }
raft = { path = "crates/raft" }
host = { path = "crates/host" }
# Pinned exactly: the wasm-bindgen CLI (see justfile and CI) must match this version.
wasm-bindgen = "=0.2.130"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Determinism rules from design/design-proposal.md section 4.
# Banned paths live in clippy.toml.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
float_arithmetic = "deny"

[profile.release]
opt-level = "s"
lto = true
