{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "airport-simulator.fullname" . }}
  labels:
    {{- include "airport-simulator.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "airport-simulator.selectorLabels" . | nindent 6 }}
{{- end }}
