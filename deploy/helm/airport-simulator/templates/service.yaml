# Where clients send commands.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "airport-simulator.fullname" . }}
  labels:
    {{- include "airport-simulator.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "airport-simulator.selectorLabels" . | nindent 4 }}
  ports:
    - name: client
      port: {{ .Values.service.port }}
      targetPort: client
