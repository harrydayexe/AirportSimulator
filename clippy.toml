# Determinism ban (docs/design-proposal.md section 4). Enforced by `just check`.
disallowed-methods = [
  { path = "std::time::Instant::now", reason = "real clock: simulated time arrives as a command" },
  { path = "std::time::SystemTime::now", reason = "real clock: simulated time arrives as a command" },
  { path = "std::thread::spawn", reason = "no threads: the host decides who runs next" },
  { path = "std::thread::sleep", reason = "no real waiting: the host owns time" },
  { path = "std::thread::Builder::spawn", reason = "no threads: the host decides who runs next" },
]
disallowed-types = [
  { path = "std::collections::HashMap", reason = "iteration order varies per run: use BTreeMap" },
  { path = "std::collections::HashSet", reason = "iteration order varies per run: use BTreeSet" },
  { path = "std::time::Instant", reason = "real clock: use simulated milliseconds" },
  { path = "std::time::SystemTime", reason = "real clock: use simulated milliseconds" },
  { path = "std::sync::Mutex", reason = "no shared-memory concurrency" },
  { path = "std::sync::RwLock", reason = "no shared-memory concurrency" },
]
