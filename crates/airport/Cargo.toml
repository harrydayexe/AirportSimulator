[package]
name = "airport"
description = "The airport state machine: pure, deterministic logic with no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
det.workspace = true
serde.workspace = true

[dev-dependencies]
# Tests always run the whole-state invariant scans, in release builds too.
airport = { path = ".", features = ["paranoid"] }
serde_json.workspace = true

[lints]
workspace = true

[features]
# Whole-state invariant scans after every step, also in release builds
# (they always run in debug builds and tests).
paranoid = []
