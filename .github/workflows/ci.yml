name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads rust-toolchain.toml (pinned version, components, wasm target).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Release keeps overflow checks on, so the browser stops where debug
      # does; `ms_addition_panics_on_overflow` proves it.
      - run: cargo test --release -p det
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # The ban list still catches one of each banned item.
      - run: just check-ban

  web:
    name: Web (wasm, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # Keep wasm-bindgen in step with Cargo.toml and the justfile.
          tool: just,wasm-bindgen@0.2.130
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: just wasm
      - run: cargo clippy -p airport-sim-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: bun run typecheck
        working-directory: web
      - run: bun test
        working-directory: web
      - run: bun run build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
